<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- Gradiente Fucsia / Violeta -->
    <linearGradient id="gradRecruiter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Círculo exterior sólido -->
  <circle cx="12" cy="12" r="10" fill="url(#gradRecruiter)"/>
  <!-- Anillo medio de contraste -->
  <circle cx="12" cy="12" r="7" fill="#1e1b4b"/>
  <!-- Círculo interior sólido -->
  <circle cx="12" cy="12" r="4.5" fill="url(#gradRecruiter)"/>
  <!-- Diana central blanca -->
  <circle cx="12" cy="12" r="2" fill="#ffffff"/>
  <!-- Puntos de retícula de mira -->
  <rect x="11.25" y="1" width="1.5" height="3" rx="0.75" fill="#ffffff"/>
  <rect x="11.25" y="20" width="1.5" height="3" rx="0.75" fill="#ffffff"/>
  <rect x="1" y="11.25" width="3" height="1.5" rx="0.75" fill="#ffffff"/>
  <rect x="20" y="11.25" width="3" height="1.5" rx="0.75" fill="#ffffff"/>
</svg>
