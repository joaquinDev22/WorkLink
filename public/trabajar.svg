<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="url(#gradienteCohete)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12 drop-shadow-[0_0_12px_rgba(56,189,248,0.5)]">
  <defs>
    <!-- Gradiente que va transicionando de Blanco -> Celeste -> Violeta de forma infinita -->
    <linearGradient id="gradienteCohete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#ffffff; #38bdf8; #818cf8; #ffffff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #ffffff; #38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Llama de propulsión -->
  <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
  
  <!-- Cuerpo del cohete -->
  <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
  
  <!-- Ventanilla -->
  <circle cx="15" cy="9" r="1" fill="url(#gradienteCohete)" />
  
  <!-- Alerones laterales -->
  <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
  <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
</svg>