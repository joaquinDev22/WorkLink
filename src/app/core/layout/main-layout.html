<!-- Estructura vertical de pantalla completa -->
<div class="flex flex-col h-screen w-full overflow-hidden bg-slate-950/80">
  
  <!-- 1. Header en modo estático (floating=false: no flota, ocupa su espacio natural) -->
  <app-header [floating]="false"></app-header>

  <!-- 2. Área inferior: Sidebar a la izquierda + Router-outlet a la derecha -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Área de trabajo con scroll independiente -->
    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
