<!-- Estructura vertical de pantalla completa -->
<div class="flex flex-col h-dvh w-full overflow-hidden bg-slate-50/40">
  
  <!-- 1. Header en modo estático (floating=false: no flota, ocupa su espacio natural) -->
  <app-header [floating]="false"></app-header>

  <!-- 2. Área inferior: Sidebar a la izquierda + Router-outlet a la derecha -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
    <!-- Área de trabajo con scroll independiente y min-w-0 para evitar overflow horizontal en mobile -->
   <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 overflow-y-auto overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
