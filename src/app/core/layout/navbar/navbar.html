<nav class="relative flex gap-15 md:gap-0 lg:gap-8 items-center" (mouseleave)="ocultarPildora()">
  <!-- LA PÍLDORA FÍSICA QUE VIAJA POR DETRÁS -->
  <div 
    class="pildora-deslizante"
    [style.left.px]="pildoraX()"
    [style.width.px]="pildoraW()"
    [style.opacity]="pildoraVisible() ? 1 : 0">
  </div>

  <!-- ENLACES DINÁMICOS POR ROL -->
  @for (item of navItems(); track item.route) {
    <a 
      [routerLink]="item.route" 
      routerLinkActive="text-brand-sky-light font-semibold"
      (mouseenter)="moverPildora($event)" 
      class="relative z-10 px-3.5 py-1 text-sm font-medium text-white transition-colors">
      {{ item.label }}
    </a>
  }

  <a 
    [routerLink]="" 
    routerLinkActive="text-brand-sky-light font-semibold"
    (mouseenter)="moverPildora($event)" 
    class="relative z-10 px-3.5 py-1 text-sm font-medium text-white transition-colors cursor-pointer">
    Ayuda
  </a>
</nav>
