<nav class="relative flex gap-15 md:gap-0 lg:gap-10" (mouseleave)="ocultarPildora()">
    <!-- LA PÍLDORA FÍSICA QUE VIAJA POR DETRÁS -->
  <div 
    class="pildora-deslizante"
    [style.left.px]="pildoraX()"
    [style.width.px]="pildoraW()"
    [style.opacity]="pildoraVisible() ? 1 : 0">
  </div>
  <!-- TUS ENLACES (Solo tienen relative y z-10 para quedar sobre la píldora) -->
  <a routerLink="" (mouseenter)="moverPildora($event)" class="relative z-10 px-3.5 py-1 font-medium text-white transition-colors">
    Inicio
  </a>
  <a routerLink="" (mouseenter)="moverPildora($event)" class="relative z-10 px-3.5 py-1 font-medium text-white transition-colors">
    Freelancers
  </a>
  <a routerLink="" (mouseenter)="moverPildora($event)" class="relative z-10 px-3.5 py-1 font-medium text-white transition-colors">
    Enterprise
  </a>
    <!-- EL (mouseenter) VA EN ESTE CONTENEDOR -->
  <div class="relative group" (mouseenter)="moverPildora($event)">
    
    <!-- Botón activador con el mismo padding y altura que los demás -->
    <button type="button" class="relative z-10 flex items-center gap-1 px-3.5 py-1 font-medium text-white transition-colors cursor-pointer">
      <span>Más</span>
      <svg class="w-3.5 h-3.5 transition-transform duration-200 group-hover:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Menú desplegable -->
    <div class="absolute top-full left-1/2 -translate-x-1/2 pt-2 hidden group-hover:block z-50">
      <div class="w-44 py-2 rounded-xl bg-white/80 backdrop-blur-xl border border-white/60 hover:shadow-xl flex flex-col">
        <a href="" class="px-4 py-2 text-sm text-slate-700 hover:bg-brand-indigo-light hover:text-white transition-colors">
          Sobre Nosotros
        </a>
        <a href="" class="px-4 py-2 text-sm text-slate-700 hover:bg-brand-indigo-light hover:text-white transition-colors">
          Contáctanos
        </a>
      </div>
    </div>
  </div>
</nav>
