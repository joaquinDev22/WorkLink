<header 
  [class.fixed]="floating()"
  [class.top-0]="floating()"
  [class.left-0]="floating()"
  [class.relative]="!floating()"
  [class.border-b]="!floating()"
  class="w-full z-50 backdrop-blur-md p-4 flex items-center justify-between border-white/10"
>
    <!-- 1. Capa de fondo con blur (evita atrapar al fixed del sidebar) -->
    <div class="absolute inset-0 backdrop-blur-lg -z-10 pointer-events-none"></div>

    <!-- 2. Barra del Header (Flex principal) -->
    <div class="flex items-center justify-between w-full">
        <!-- Logo -->
        <div class="flex items-center space-x-5">
            <div class="md:h-14 md:w-16 h-17 w-18 bg-glass-surface rounded-3xl md:rounded-2xl flex px-2.5 justify-center items-center">
                <img src="/worklink logo.svg" alt="worklink-logo" class="w-full h-full">
            </div>
            <div [routerLink]="homeRoute()" class="hover:cursor-pointer active:scale-95 transition-transform duration-150">
                <h1 class="font-bold text-2xl md:4xl text-white text-center hover:text-shadow-glow-white">Work<span class="text-brand-sky">Link</span></h1>
            </div>
        </div>

        @if (!isMinWidth()) {
            @if (!auth.session()) {
                <!-- Desktop Visitante: Botones de Auth -->
                <div class="flex flex-col md:flex-row justify-end md:gap-5 gap-1.5">
                    <button class="m-px px-4 py-2 rounded-xl cursor-pointer font-medium text-white btn-iniciar-sesion" routerLink="/auth/login">Iniciar Sesión</button>
                    <button class="bg-conic bg-brand-violet m-px py-2 px-4 rounded-xl cursor-pointer font-medium text-white btn-registrarse" routerLink="/auth/register">Registrarse</button>
                </div>
            } @else {
                <!-- Desktop Autenticado: Navbar + Perfil y Logout -->
                <!-- Avatar: Renderiza la foto si existe, sino muestra la inicial -->
                <app-navbar class="hidden md:flex"></app-navbar> 
                <a routerLink="/perfiles/mi-perfil" class="flex justify-center items-center w-12 h-12 bg-brand-sky text-white text-lg font-bold rounded-full cursor-pointer">
                    
                    @if (fotoUrl()) {
                        <img [src]="fotoUrl()" alt="Foto de perfil" class="w-full h-full object-cover">
                    } @else {
                        <span>{{ auth.session()?.nombreUsuario?.charAt(0)?.toUpperCase() || 'U' }}</span>
                    }

                </a>
            }
        } @else {
            <!-- Móvil: La hamburguesa SOLO se muestra si el usuario está autenticado -->
            @if (auth.session()) {
                <app-burger-menu class="relative z-50" [(isActivo)]="isMenuOpen"></app-burger-menu>
            }
        }
    </div>

    <!-- 3. Sidebar: Solo se instancia en móvil si existe una sesión activa -->
    @if (isMinWidth() && auth.session()) {
        <app-sidebar [(isOpen)]="isMenuOpen"></app-sidebar>
    }
</header>
