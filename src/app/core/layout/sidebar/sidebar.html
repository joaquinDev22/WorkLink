<!-- Fondo oscuro difuminado (al hacer clic afuera, se cierra con fade-in / fade-out) -->
<div 
  class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity duration-300"
  [class.opacity-100]="isOpen()"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-none]="!isOpen()"
  (click)="cerrar()">
</div>

<!-- Panel lateral deslizante (z-40 para que el burger con z-50 quede por encima, pt-24 para no colisionar con la barra) -->
<aside 
  class="fixed top-0 right-0 h-dvh w-[80vw] max-w-xs bg-slate-950/90 backdrop-blur-2xl gap-4 border-l border-glass-border z-40 p-6 pt-24 flex flex-col shadow-2xl transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="isOpen()"
  [class.translate-x-full]="!isOpen()">

    @if (!auth.session()) {
      <button routerLink="/auth/login" (click)="cerrar()" class="w-full py-3 px-4 rounded-xl font-medium text-white btn-iniciar-sesion text-center cursor-pointer">
        Iniciar Sesión
      </button>
      <button routerLink="/auth/register" (click)="cerrar()" class="w-full py-3 px-4 rounded-xl font-medium text-white bg-brand-violet btn-registrarse text-center cursor-pointer">
        Registrarse
      </button>
    } @else {
        <div class="flex flex-col gap-6">
            <div class="flex items-center gap-3 pb-4 border-b border-glass-border">
                <div class="size-10 rounded-full bg-brand-indigo/30 border border-brand-indigo-light/50 flex items-center justify-center text-white font-bold text-sm shadow-inner-indigo">
                {{ auth.session()?.nombreUsuario?.charAt(0)?.toUpperCase() }}
                </div>
                <div class="flex flex-col overflow-hidden">
                <span class="text-xs text-slate-400">Conectado como</span>
                <span class="text-white text-sm font-semibold truncate">{{ auth.session()?.nombreUsuario }}</span>
                </div>
            </div>
            <button 
            (click)="auth.logout(); cerrar()" 
            class="w-full py-2.5 px-3 rounded-xl text-sm font-medium text-brand-danger-muted bg-brand-danger/20 border border-brand-danger-muted/30 hover:bg-brand-danger/40 hover:text-white transition-all cursor-pointer">
                Cerrar Sesión
            </button>
        </div>
    }
</aside>
