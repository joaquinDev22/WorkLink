<div class="flex flex-col justify-center items-center min-h-screen">
    <form class="bg-linear-to-t from-indigo-800/50 to-indigo-400/50 backdrop-blur-xs px-6 py-4 rounded-2xl w-full max-w-md h-auto mx-4 space-y-5 shadow-2xl shadow-indigo-400/50" (submit)="iniciarSesion($event)">
        <h2 class="text-center text-3xl font-bold text-white mb-1">Bienvenido</h2>
        <h4 class="text-md text-indigo-800 text-center mb-2">Inicia sesión para continuar</h4>
        <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Usuario:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="text" placeholder="usuario3312" [ngModel]="user()" (ngModelChange)="user.set($event)" name="usuario">
        </fieldset>
        <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Contraseña:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="password" placeholder="••••••••"
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)" 
            name="password">
        </fieldset>
        <fieldset class="flex justify-between">
            <label class="flex items-center gap-2.5 cursor-pointer text-white font-medium text-sm select-none">
                <input 
                type="checkbox" 
                class="custom-checkbox size-4.5 rounded-md appearance-none border border-white/40 bg-white/20 backdrop-blur-sm cursor-pointer
                        checked:bg-indigo-600 checked:border-indigo-400
                        focus:outline-none focus:ring-2 focus:ring-indigo-400/50 transition-all">
                <span>Recuérdame</span>
            </label>
            <a class="font-medium text-blue-400 underline">Olvide mi contraseña</a>
        </fieldset>
        <button class="w-full text-center p-4 bg-indigo-600 text-white rounded-2xl shadow-inner shadow-indigo-400 cursor-pointer hover:bg-indigo-800 hover:shadow-indigo-600 transition-all duration-300 ease-in-out" type="submit">Iniciar Sesión</button>
        <div class="flex items-center gap-3">
            <div class="flex-1 border-t border-white/30"></div>
                <span class="text-xs uppercase font-semibold text-white/70">O</span>
            <div class="flex-1 border-t border-white/30"></div>
        </div>
        <button class="w-full text-center p-4 bg-slate-200 text-black rounded-2xl shadow-inner shadow-slate-400 cursor-pointer hover:bg-slate-300 hover:shadow-slate-800 transition-all duration-300 ease-in-out flex justify-center gap-2" type="button">Inicia sesión con Google<img class="w-6" src="/googleLogo.png"></button>
    </form>
</div>
