<div class="flex flex-col justify-center items-center py-6">
    <form 
    class="bg-linear-to-t from-indigo-800/50 to-indigo-400/50 backdrop-blur-xs px-6 py-8 rounded-2xl w-full max-w-md h-auto mx-4 space-y-5 shadow-2xl shadow-indigo-400/50">
        <h2 class="text-center text-3xl font-bold text-white mb-1">Bienvenido</h2>
        <h4 class="text-md text-indigo-800 text-center mb-2">Crea tu cuenta para continuar</h4>
        <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Nombre:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="text" placeholder="juan">
        </fieldset>
        <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Apellido:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="text" placeholder="perez">
        </fieldset>
                <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Ciudad:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="text" placeholder="ciudad">
        </fieldset>
        <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Telefono:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="number" placeholder="+00 0 000 000000">
        </fieldset>
        <fieldset class="flex flex-col space-y-2">
            <label class="text-white font-medium" for="">Email:</label>
            <input class="bg-white p-1 rounded-lg focus:outline-none  focus:ring-4 focus:ring-indigo-400/50 px-2" type="email" placeholder="example@gmail.com">
        </fieldset>
        
        <button class="w-full text-center p-4 bg-indigo-600 text-white rounded-2xl shadow-inner shadow-indigo-400 cursor-pointer hover:bg-indigo-800 hover:shadow-indigo-600 transition-all duration-300 ease-in-out" type="submit">Siguiente</button>
    </form>
</div>
