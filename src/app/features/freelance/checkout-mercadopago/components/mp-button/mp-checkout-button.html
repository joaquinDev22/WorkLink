<button
  type="button"
  (click)="iniciarCheckout()"
  [disabled]="disabled() || isRedirecting()"
  [attr.aria-busy]="isRedirecting()"
  class="btn-tactile-primary w-full px-5 py-3 min-h-[44px] text-sm inline-flex items-center justify-center gap-2.5 cursor-pointer">
  @if (isRedirecting()) {
    <svg class="w-4 h-4 animate-spin text-white shrink-0" fill="none" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
    <span>Redirigiendo a MercadoPago...</span>
  } @else {
    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
    </svg>
    <span>{{ label() }}</span>
  }
</button>
