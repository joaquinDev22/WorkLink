@if (isOpen()) {
  <div class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-agenda-title" role="dialog" aria-modal="true">
    <!-- Backdrop desenfocado -->
    <div
      (click)="onClose()"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm animate-modal-backdrop transition-opacity"
    ></div>

    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <div
        class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl sm:my-8 w-full sm:max-w-lg border border-slate-200/90 animate-modal-card"
      >
        <!-- Encabezado del Modal -->
        <div class="border-b border-slate-100 px-6 py-5 bg-slate-50/70 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-brand-indigo/10 border border-brand-indigo/20 flex items-center justify-center text-brand-indigo">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <div>
              <h3 id="modal-agenda-title" class="text-base font-bold text-slate-900">
                Coordinar Entrevista Técnica
              </h3>
              <p class="text-xs text-slate-500 font-medium">
                Programa un encuentro virtual con el candidato seleccionado.
              </p>
            </div>
          </div>

          <button
            type="button"
            (click)="onClose()"
            class="btn-tactile-icon min-w-[40px] min-h-[40px] p-2 flex items-center justify-center"
            aria-label="Cerrar modal"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="px-6 py-5 space-y-4">
          @if (errorMsg()) {
            <div class="rounded-xl bg-rose-50 border border-rose-200 p-3.5 text-xs text-rose-800 flex items-center gap-2.5 animate-row-enter">
              <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <span>{{ errorMsg() }}</span>
            </div>
          }

          <!-- Selección del Candidato -->
          <div class="space-y-1">
            <label for="agenda-candidato" class="text-xs font-semibold text-slate-700">
              Candidato a Entrevistar
            </label>
            <select
              id="agenda-candidato"
              [ngModel]="selectedPostulacionId()"
              (ngModelChange)="selectedPostulacionId.set($event)"
              class="w-full rounded-xl border border-slate-300 p-2.5 text-xs sm:text-sm text-slate-800 bg-white shadow-inner focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            >
              @for (c of candidatos(); track c.postulacionId) {
                <option [value]="c.postulacionId">
                  {{ c.nombreCandidato }} ({{ c.puestoVacante }})
                </option>
              }
            </select>
          </div>

          <!-- Fecha y Hora -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="space-y-1">
              <label for="agenda-fecha" class="text-xs font-semibold text-slate-700">
                Fecha del Encuentro
              </label>
              <input
                id="agenda-fecha"
                type="date"
                [min]="minDate"
                [ngModel]="fecha()"
                (ngModelChange)="fecha.set($event)"
                class="w-full rounded-xl border border-slate-300 p-2 text-xs sm:text-sm text-slate-800 bg-white shadow-inner focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>

            <div class="space-y-1">
              <label for="agenda-hora" class="text-xs font-semibold text-slate-700">
                Horario
              </label>
              <input
                id="agenda-hora"
                type="time"
                [ngModel]="hora()"
                (ngModelChange)="hora.set($event)"
                class="w-full rounded-xl border border-slate-300 p-2 text-xs sm:text-sm text-slate-800 bg-white shadow-inner focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>
          </div>

          <!-- Enlace de Videollamada (Google Meet) -->
          <div class="space-y-1">
            <div class="flex items-center justify-between text-xs">
              <label for="agenda-link" class="font-semibold text-slate-700">
                Enlace de Videollamada
              </label>
              <span class="text-[11px] text-slate-400">Opcional (se autogenera Meet)</span>
            </div>
            <input
              id="agenda-link"
              type="url"
              [ngModel]="link()"
              (ngModelChange)="link.set($event)"
              placeholder="https://meet.google.com/..."
              class="w-full rounded-xl border border-slate-300 p-2.5 text-xs sm:text-sm text-slate-800 bg-white shadow-inner focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            />
          </div>

          <!-- Notas / Foco de la Entrevista -->
          <div class="space-y-1">
            <label for="agenda-notas" class="text-xs font-semibold text-slate-700">
              Temas y Objetivos de la Sesión
            </label>
            <textarea
              id="agenda-notas"
              rows="3"
              [ngModel]="notas()"
              (ngModelChange)="notas.set($event)"
              placeholder="Ej: Revisión de arquitectura frontend, preguntas sobre diseño y preguntas del candidato..."
              class="w-full rounded-xl border border-slate-300 p-2.5 text-xs sm:text-sm text-slate-800 bg-white shadow-inner focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 resize-none"
            ></textarea>
          </div>
        </div>

        <!-- Acciones Táctiles del Modal -->
        <div class="border-t border-slate-100 bg-slate-50 px-6 py-4 flex items-center justify-end gap-3">
          <button
            type="button"
            (click)="onClose()"
            [disabled]="isSubmitting()"
            class="btn-tactile-secondary text-xs sm:text-sm px-4 py-2"
          >
            Cancelar
          </button>

          <button
            type="button"
            (click)="onSubmit()"
            [disabled]="isSubmitting()"
            class="btn-tactile-primary text-xs sm:text-sm px-5 py-2 inline-flex items-center gap-2"
          >
            @if (isSubmitting()) {
              <svg class="w-4 h-4 text-white animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Coordinando...</span>
            } @else {
              <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>Confirmar y Notificar</span>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
